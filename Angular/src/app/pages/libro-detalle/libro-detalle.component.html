<div *ngIf="libro" class="detalle-libro">
  <div class="libro-contenido">
    
    <!-- 📕 Columna izquierda -->
    <div class="libro-izquierda">
      <img [src]="libro.volumeInfo.imageLinks?.thumbnail || 'assets/imagen-no-disponible.jpg'" alt="Portada" />
      <h2>{{ libro.volumeInfo.title }}</h2>
      <p><strong>Autor:</strong> {{ libro.volumeInfo.authors?.[0] || 'Autor desconocido' }}</p>

      <p *ngIf="libro.saleInfo?.listPrice?.amount !== undefined; else noStock">
        <strong>Precio:</strong> {{ libro.saleInfo.listPrice.amount }} €
      </p>
      <ng-template #noStock>
        <p class="sin-stock">❌ No hay stock</p>
      </ng-template>

      <div class="acciones-centro">
        <button (click)="comprarLibro()">Comprar</button>
      </div>
    </div>

    <!-- 📝 Columna derecha -->
    <div class="libro-derecha">
      <p><strong>Descripción:</strong></p>
      <p [innerHTML]="libro.volumeInfo.description || 'Sin descripción disponible.'"></p>
    </div>

  </div>
</div>
