<div *ngIf="item" class="detalle-serie">
  <h2>{{ item.title || item.name }}</h2>

  <div class="contenido-serie">
    <div class="imagen">
      <img
        [src]="posterUrl"
        alt="Poster"
        (error)="reemplazarImagen($event)"
      />
    </div>

    <div class="descripcion">
      <p><strong>Descripción:</strong></p>
      <p>{{ item.overview || 'Sin descripción disponible.' }}</p>
    </div>
  </div>

  <div class="boton-centro">
    <button (click)="abrirModal()">
      Añadir a mi lista
    </button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" *ngIf="mostrarModal">
  <div class="modal">

    <h3>{{ item?.title || item?.name }}</h3>

    <!-- SOLO para series -->
    <div *ngIf="esSerie" class="campos-horizontal">
      <div class="campo-horizontal">
        <label>Temporada:</label>
        <input type="number" [(ngModel)]="temporada" min="1">
      </div>

      <div class="campo-horizontal">
        <label>Capítulo:</label>
        <input type="number" [(ngModel)]="capitulo" min="1">
      </div>
    </div>

    <div class="campos-horizontal">
      <div class="campo-horizontal">
        <label>Estado:</label>
        <select [(ngModel)]="estadoSeleccionado">
          <option value="viendo">Viendo</option>
          <option value="terminado">Terminado</option>
          <option value="pendiente">Pendiente</option>
          <option value="abandonado">Abandonado</option>
          <option value="plan para ver">Plan para ver</option>
        </select>
      </div>

      <div class="campo-horizontal">
        <label>Puntuación:</label>
        <input type="number" [(ngModel)]="puntuacion" min="1" max="10" />
      </div>
    </div>

    <!-- RESEÑAS (dentro del modal) -->
    <section class="reseñas">
      <h4>📝 Reseñas de usuarios</h4>

      <div *ngIf="resenas.length > 0; else sinResenas">
        <div class="resena" *ngFor="let r of resenas">
          <p class="contenido-resena">“{{ r.contenido }}”</p>
          <small class="autor-resena">
            Usuario #{{ r.usuarioId }} · {{ r.fechaCreacion | date:'shortDate' }}
          </small>
        </div>
      </div>

      <ng-template #sinResenas>
        <p class="estado">Todavía no hay reseñas para este título.</p>
      </ng-template>

      <div class="nueva-resena" *ngIf="authService.estaLogueado()">
        <textarea
          [(ngModel)]="nuevaResena"
          rows="3"
          placeholder="Escribe tu reseña..."
        ></textarea>

        <button (click)="guardarResena()" [disabled]="!nuevaResena.trim()">
          Publicar reseña
        </button>
      </div>
    </section>

    <div class="modal-buttons">
      <button (click)="guardarItem()">Guardar</button>
      <button class="cancelar" (click)="cerrarModal()">Cancelar</button>
    </div>

  </div>
</div>
