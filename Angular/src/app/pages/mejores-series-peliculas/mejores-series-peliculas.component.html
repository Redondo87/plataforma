<div class="mejores-series-container">
  <table class="table-ranking" *ngIf="mejoresSeries.length > 0">
    <thead>
      <tr>
        <th>Ranking</th>
        <th>Título</th>
        <th>Puntuación promedio</th>
        <th>Tu puntuación</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let serie of mejoresSeries">
        <td>{{ serie.ranking }}</td>
        <td class="titulo-imagen">
          <img [src]="serie.imagen" alt="{{ serie.titulo }}" style="height:50px; margin-right:5px;" />
          {{ serie.titulo }}
        </td>
        <td>{{ serie.promedio | number:'1.1-2' }}</td>
        <td>{{ serie.miPuntuacion || '-' }}</td>
        <td>
          <button
            [disabled]="!estaLogueado"
            (click)="abrirModal(serie)"
            [title]="!estaLogueado ? 'Inicia sesión para añadir series/películas' : ''"
          >
            Añadir a mi lista
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="cargando" class="loading">Cargando...</div>
  <div *ngIf="error" class="error">{{ error }}</div>
</div>

<!-- Modal -->
<div class="modal-overlay" *ngIf="mostrarModal">
  <div class="modal">
    <h3>{{ serieSeleccionada?.titulo }}</h3>

    <div class="campos-horizontal">
      <div class="campo-horizontal">
        <label>Estado:</label>
        <select [(ngModel)]="estadoSeleccionado">
          <option value="viendo">Viendo</option>
          <option value="terminado">Terminado</option>
          <option value="en espera">En espera</option>
          <option value="abandonado">Abandonado</option>
          <option value="plan para ver">Plan para ver</option>
        </select>
      </div>

      <div class="campo-horizontal">
        <label>Puntuación:</label>
        <input type="number" [(ngModel)]="puntuacion" min="1" max="10" />
      </div>
    </div>

    <div class="modal-buttons">
      <button (click)="guardarSerie()">Guardar</button>
      <button class="cancelar" (click)="cerrarModal()">Cancelar</button>
    </div>
  </div>
</div>
