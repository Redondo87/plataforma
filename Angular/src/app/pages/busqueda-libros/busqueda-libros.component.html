<!--<h2>📚 Búsqueda de Libros</h2> -->

<!-- 🔍 Buscador -->
<input
  type="text"
  placeholder="Buscar un libro..."
  [(ngModel)]="busqueda"
  (input)="buscarLibros()"
/>

<!-- 📑 Lista de géneros en horizontal -->
<h3>Géneros</h3>
<div class="generos-grid">
  <span
    *ngFor="let genero of generos"
    class="genero"
    (click)="buscarPorGenero(genero)"
  >
    {{ genero }}
  </span>
</div>

<!-- 📖 Resultados -->
<div *ngIf="resultados.length > 0">
  <h3>Resultados</h3>
  <ul>
    <li *ngFor="let libro of resultados">
      <a [routerLink]="['/libro', libro.id]">
        <img
          [src]="libro.imagen"
          alt="Portada"
          style="width: 60px; margin-right: 10px; cursor: pointer;"
        />
      </a>
      <div>
        <strong>{{ libro.titulo }}</strong> - {{ libro.autor }}
        <p>{{ libro.descripcion }}</p>
      </div>
    </li>
  </ul>
</div>
