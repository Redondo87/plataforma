<!-- 🔍 Buscador -->
<div class="buscador-container">
  <input
    type="text"
    placeholder="Buscar un libro..."
    [(ngModel)]="busqueda"
    (input)="buscarLibros()"
  />

  <!-- 📖 Resultados flotantes -->
  <div class="resultados-flotantes" *ngIf="!modoGenero && resultados.length > 0">
    <ul>
      <li *ngFor="let libro of resultados">
        <a [routerLink]="['/busqueda-libro', libro.id]">
          <img
            [src]="libro.imagen || '/assets/images/imagenNoDisponible.png'"
            alt="Portada"
            (error)="reemplazarImagen($event)"
          />
        </a>
        <div>
          <strong>{{ libro.titulo }}</strong> - {{ libro.autor }}
          <p>{{ libro.descripcion }}</p>
        </div>
      </li>
    </ul>
  </div>
</div>

<!-- 📑 Lista de géneros -->
<div *ngIf="!modoGenero">
  <h3>Géneros</h3>
  <div class="generos-grid">
    <span
      *ngFor="let genero of generos"
      class="genero"
      (click)="buscarPorGenero(genero)"
    >
      {{ genero }}
    </span>
  </div>
</div>

<!-- 📚 Resultados de género -->
<div *ngIf="modoGenero">
  <h3>Resultados</h3>

  <p *ngIf="mensaje" class="mensaje">{{ mensaje }}</p>

  <!-- 👇 AQUI SE AGREGA LA CLASE lista-libros -->
  <ul *ngIf="resultados.length > 0" class="lista-libros">
    <li *ngFor="let libro of resultados">
      <a [routerLink]="['/busqueda-libro', libro.id]">
        <img
          [src]="libro.imagen || '/assets/images/imagenNoDisponible.png'"
          alt="Portada"
          (error)="reemplazarImagen($event)"
        />
      </a>
      <div>
        <strong>{{ libro.titulo }}</strong> - {{ libro.autor }}
        <p>{{ libro.descripcion }}</p>
      </div>
    </li>
  </ul>
</div>
