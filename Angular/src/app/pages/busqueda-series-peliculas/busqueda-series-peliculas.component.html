<div class="buscador-container">

  <!-- Barra de búsqueda -->
  <input
    type="text"
    placeholder="Buscar series o películas..."
    [(ngModel)]="terminoBusqueda"
    (input)="onInput()"
    class="barra-busqueda"
    autocomplete="off"
  />

  <!-- Cuadro flotante de sugerencias -->
  <div class="resultados-flotantes" *ngIf="sugerencias.length > 0">
    <ul>
      <li *ngFor="let s of sugerencias" (click)="irADetalle(s); $event.stopPropagation()">
        <img [src]="s.portada" alt="{{ s.titulo }}" />
        <div>
          <strong>{{ s.titulo }}</strong>
          <div>{{ s.creadores }}</div>
          <div>{{ s.descripcion }}</div>
        </div>
      </li>
    </ul>
  </div>

  <!-- Lista de géneros -->
  <div class="generos-grid" *ngIf="mostrarGeneros">
  <div
    *ngFor="let genero of generosTMDB"
    class="genero"
    (click)="filtrarPorGenero(genero)"
    [class.activo]="generoSeleccionado === genero"
  >
    {{ genero }}
  </div>
</div>

  <!-- Tarjetas de resultados -->
  <div class="resultados">
    <div class="card" *ngFor="let item of resultadosFiltrados" (click)="abrirModal(item)">
      <img
        [src]="item.portada"
        alt="Portada"
        (click)="irADetalle(item); $event.stopPropagation()"
      />
      <div class="card-text">
        <h3>{{ item.titulo }}</h3>
        <p class="creadores">{{ item.creadores }}</p>
        <p class="descripcion">{{ item.descripcion }}</p>
      </div>
    </div>
  </div>

  <!-- MODAL DETALLE -->
  <div class="modal" *ngIf="itemSeleccionado" (click)="cerrarModal()">
    <div class="modal-content detalle-card" (click)="$event.stopPropagation()">
      <div class="detalle-imagen">
        <img [src]="itemSeleccionado.portada" alt="Portada" />
      </div>

      <div class="detalle-info">
        <h2 class="detalle-titulo">{{ itemSeleccionado.titulo }}</h2>
        <p><strong>Tipo:</strong> {{ itemSeleccionado.media_type }}</p>
        <p class="descripcion">{{ itemSeleccionado.descripcion }}</p>

        <div class="acciones">
          <label>Estado:</label>
          <select [(ngModel)]="estadoSeleccionado">
            <option value="viendo">Viendo</option>
            <option value="terminado">Terminado</option>
            <option value="en espera">En espera</option>
            <option value="abandonado">Abandonado</option>
            <option value="plan para ver">Plan para ver</option>
          </select>

          <label>Puntuación:</label>
          <input type="number" [(ngModel)]="puntuacion" min="1" max="10" />

          <!-- Para series: temporada y capítulo -->
          <div *ngIf="itemSeleccionado.media_type === 'serie'">
            <label>Temporada:</label>
            <input type="number" [(ngModel)]="temporada" min="1" />

            <label>Capítulo:</label>
            <input type="number" [(ngModel)]="capitulo" min="1" />
          </div>

          <button (click)="guardarItem()">Guardar</button>
          <button class="cancelar" (click)="cerrarModal()">Cancelar</button>
        </div>
      </div>
    </div>
  </div>
</div>
