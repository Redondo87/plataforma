<div class="buscador-container">

  <!-- Barra de búsqueda -->
  <input
    type="text"
    placeholder="Buscar series o películas..."
    [(ngModel)]="terminoBusqueda"
    (input)="onInput()"
    class="barra-busqueda"
    autocomplete="off"
  />

  <!-- Cuadro flotante de sugerencias -->
  <div class="resultados-flotantes" *ngIf="mostrarSugerencias && sugerencias.length > 0">
    <ul>
      <li *ngFor="let s of sugerencias" (click)="irADetalle(s)" class="sugerencia-item">
        <img [src]="s.portada" alt="{{ s.titulo }}" />
        <div class="sugerencia-texto">
          <strong class="sugerencia-titulo">{{ s.titulo }}</strong>
          <div class="sugerencia-sub">{{ s.creadores }}</div>
          <div class="sugerencia-descripcion">{{ s.descripcion }}</div>
        </div>
      </li>
    </ul>
  </div>

  <!-- Título de géneros -->
  <h3 class="titulo-generos">Géneros</h3>

  <!-- Lista de géneros -->
  <div class="generos-grid">
    <div
      *ngFor="let genero of generos"
      class="genero"
      (click)="filtrarPorGenero(genero)"
      [class.activo]="generoSeleccionado === genero"
    >
      {{ genero }}
    </div>
  </div>

  <!-- Resultados principales -->
  <div class="resultados">
    <div class="card" *ngFor="let item of resultadosFiltrados" (click)="abrirModal(item)">
      <img [src]="item.portada" alt="Portada" />
      <h3>{{ item.titulo }}</h3>
      <p class="creadores">{{ item.creadores }}</p>
      <p class="descripcion">{{ item.descripcion }}</p>
    </div>
  </div>

  <div class="modal" *ngIf="itemSeleccionado" (click)="cerrarModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <img [src]="itemSeleccionado.portada" alt="Portada" />
      <h2>{{ itemSeleccionado.titulo }}</h2>
      <p><strong>Tipo:</strong> {{ itemSeleccionado.media_type }}</p>
      <p>{{ itemSeleccionado.descripcion }}</p>
      <button class="btn-cerrar" (click)="cerrarModal()">Cerrar</button>
    </div>
  </div>

</div>
