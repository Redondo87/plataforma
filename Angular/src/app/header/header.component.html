<header class="header">
  <!-- Sección izquierda: Perfil o cerrar sesión -->
  <div class="header-left">
    <ng-container *ngIf="usuarioLogueado; else perfilLink">
      <div class="usuario-logueado">
        <span class="nav-link">Hola, {{ nombreUsuario }}</span>
        <img
          src="assets/images/salida.png"
          alt="Cerrar sesión"
          class="icon-salida"
          title="Cerrar sesión"
          (click)="cerrarSesion()" />
      </div>
    </ng-container>

    <ng-template #perfilLink>
      <a (click)="toggleLogin()" class="nav-link">Perfil</a>
    </ng-template>
  </div>

  <!-- Sección centro: Logo -->
  <div class="logo-container">
    <a routerLink="/" class="logo-link">
      <img src="assets/images/logo2.png" alt="Logo" class="logo" />
    </a>
  </div>

  <!-- Sección derecha: Íconos -->
  <div class="header-right">
    <img src="assets/images/lupa.png" alt="Libros" class="icon" (click)="toggleLibros()" />
    <img src="assets/images/video.png" alt="Series" class="icon" (click)="toggleSeries()" />
  </div>
</header>

<!-- Buscador de libros -->
<div class="fullscreen-search" *ngIf="mostrarBuscadorLibros">
  <div class="search-content" [ngClass]="{ 'has-images': resultadosHeaderLibros.length > 0 }">
    <img src="assets/images/equis.jpg" alt="Cerrar" class="close-icon" (click)="cerrarBuscadorLibros()" />
    <input
      type="text"
      class="search-input"
      placeholder="Buscar libros..."
      [(ngModel)]="busquedaHeaderLibros"
      (input)="buscarLibros()"
    />
    <ul class="resultados-lista imagenes" *ngIf="resultadosHeaderLibros.length > 0">
      <li *ngFor="let libro of resultadosHeaderLibros">
        <a [routerLink]="['/libro', libro.id]" (click)="cerrarBuscadorLibros()">
          <img [src]="libro.volumeInfo.imageLinks?.thumbnail || 'assets/images/imagenNoDisponible.png'"
               alt="Portada de {{ libro.volumeInfo?.title }}" />
        </a>
      </li>
    </ul>
  </div>
</div>

<!-- Buscador de series/películas -->
<div class="fullscreen-search" *ngIf="mostrarBuscadorSeries">
  <div class="search-content" [ngClass]="{ 'has-images': resultadosHeaderSeries.length > 0 }">
    <img src="assets/images/equis.jpg" alt="Cerrar" class="close-icon" (click)="cerrarBuscadorSeries()" />
    <input
      type="text"
      class="search-input"
      placeholder="Buscar series o películas..."
      [(ngModel)]="busquedaHeaderSeries"
      (input)="buscarSeries()"
    />
    <ul class="resultados-lista imagenes" *ngIf="resultadosHeaderSeries.length > 0">
      <li *ngFor="let item of resultadosHeaderSeries">
        <a [routerLink]="['/serie', item.media_type, item.id]" (click)="cerrarBuscadorSeries()">
          <img [src]="getPosterUrl(item.poster_path)" alt="Portada de {{ item.title || item.name }}" />
        </a>
      </li>
    </ul>
  </div>
</div>
